[project]
name = "homewatch"
version = "0.4.8"
description = "Correlate Home Assistant / HomePod outages with Apple & HA software releases — local-first CLI + optional daemon, device inventory, on-demand release notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcint", email = "loren.p.mc@gmail.com" }]
keywords = [
    "home-assistant", "homepod", "homekit", "matter", "apple",
    "release-tracking", "endoflife", "self-hosted", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
]
# Default install is the lean "version tracker" (release feeds + CLI + daemon).
# LAN device probing is opt-in via extras — pyatv is heavy (protobuf/miniaudio).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=0.3.27",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "typer>=0.15",
    "rich>=13.9",
    "python-multipart>=0.0.18",
]

[project.urls]
Homepage = "https://github.com/mcint/homewatch"
Repository = "https://github.com/mcint/homewatch"
Issues = "https://github.com/mcint/homewatch/issues"

[project.optional-dependencies]
# HomePod/Apple LAN probe via pyatv (preferred; heavy).
probe = ["pyatv>=0.16"]
# Lighter raw-mDNS fallback if pyatv pulls in too much.
zeroconf = ["zeroconf>=0.136"]
# Everything for on-LAN device discovery.
all = ["pyatv>=0.16", "zeroconf>=0.136"]

[project.scripts]
homewatch = "homewatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homewatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
