[project]
name = "homewatch"
version = "0.4.0"
description = "Correlate Home Assistant outages with Apple / HomePod / HA software releases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcint", email = "loren.p.mc@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=0.3.27",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "typer>=0.15",
    "rich>=13.9",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# HomePod LAN probe is heavy (protobuf/miniaudio); install on the LAN agent only.
probe = ["pyatv>=0.16"]
# Lighter raw-mDNS fallback if pyatv pulls in too much.
zeroconf = ["zeroconf>=0.136"]

[project.scripts]
homewatch = "homewatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homewatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
